# Tinify MCP streamable-HTTP endpoint.
#
# These location blocks belong INSIDE the existing `server { ... }` block for
# api.tinify.dev (the 443/ssl one). Paste them next to the other location
# blocks, reload nginx (nginx -t && systemctl reload nginx), and the MCP
# endpoint is live at https://api.tinify.dev/mcp.

location /mcp {
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # MCP responses may stream; never buffer either direction.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    # Mirrors the server's own 48 MB body cap (~28 MB image decoded, base64
    # inflated by ~4/3, plus JSON envelope).
    client_max_body_size 48m;
}

location = /healthz-mcp {
    proxy_pass http://127.0.0.1:3102/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
